<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microphone Permission - Gemma 4 Voice Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #131c31;
      padding: 36px;
      border-radius: 16px;
      border: 1px solid #1e293b;
      text-align: center;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #10b981;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙️ Enable Voice Commands for Gemma 4</h1>
    <p>Grant one-time microphone access so Gemma 4 can listen to your voice commands and control the browser hands-free.</p>
    <button id="grantBtn">Allow Microphone Access</button>
    <div id="status" class="status">✓ Microphone access enabled! Returning to side panel...</div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
