<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microphone Permission - Privacy Vision Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      max-width: 440px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #10b981;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙️ Grant Microphone Access</h1>
    <p>Chrome requires one-time permission to allow voice commands (STT) inside the Privacy Vision Agent side panel.</p>
    <button id="grantBtn">Click to Allow Microphone</button>
    <div id="status" class="status">✓ Microphone granted! You can close this tab and return to the Side Panel.</div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
