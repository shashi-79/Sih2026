<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy-Preserving Vision Agent Benchmark (3-Level Nested Iframe Fixture)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .title-group h1 {
      font-size: 20px;
      margin: 0 0 6px 0;
      color: #38bdf8;
    }
    .badge {
      background: #0284c7;
      color: white;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .profile-card {
      display: flex;
      gap: 16px;
      align-items: center;
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .avatar-canvas {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      background: #334155;
    }
    .profile-info h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
    }
    .profile-info p {
      margin: 0;
      font-size: 12px;
      color: #94a3b8;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }
    .iframe-wrapper {
      margin-top: 20px;
      border: 2px dashed #0284c7;
      border-radius: 8px;
      padding: 12px;
      background: #0c1322;
    }
    .iframe-header {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 8px;
    }
    iframe {
      width: 100%;
      height: 480px;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>Autonomous Checkout Benchmark</h1>
        <span style="font-size: 12px; color: #94a3b8;">Level 0: Top-Level Host Document</span>
      </div>
      <span class="badge">SIH Privacy Benchmark</span>
    </header>

    <!-- Profile section with Face Avatar for OpenCV visual detection -->
    <div class="profile-card">
      <canvas id="faceAvatar" class="avatar-canvas" width="80" height="80"></canvas>
      <div class="profile-info">
        <h3>Jane Doe (Verified Account)</h3>
        <p>National Identity SSN: <strong>987-65-4321</strong> (Visual & DOM PII Target)</p>
      </div>
    </div>

    <!-- Top-Level Customer Form -->
    <div class="grid">
      <div class="form-group">
        <label>Full Legal Name</label>
        <input type="text" id="custName" value="Jane Doe" />
      </div>
      <div class="form-group">
        <label>Shipping Address</label>
        <input type="text" id="shipAddr" value="742 Evergreen Terrace, Sector 5" />
      </div>
    </div>

    <!-- Embedded Nested Iframe Level 1 -->
    <div class="iframe-wrapper">
      <div class="iframe-header">↳ Embedded Frame: Level 1 (Billing Portal) & Level 2 (Payment Gateway)</div>
      <iframe id="billingIframe" src="nested-iframe-1.html" title="Billing Frame"></iframe>
    </div>
  </div>

  <script>
    // Draw synthetic human facial features on canvas for OpenCV Haar Cascade detection
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('faceAvatar');
      const ctx = canvas.getContext('2d');

      // Head / Skin Tone
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath();
      ctx.arc(40, 40, 32, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(40, 32, 32, Math.PI, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(30, 36, 4, 0, Math.PI * 2);
      ctx.arc(50, 36, 4, 0, Math.PI * 2);
      ctx.fill();

      // Nose
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40, 38);
      ctx.lineTo(38, 46);
      ctx.lineTo(44, 46);
      ctx.stroke();

      // Mouth
      ctx.strokeStyle = '#b91c1c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(40, 50, 10, 0.2, Math.PI - 0.2);
      ctx.stroke();
    });
  </script>
</body>
</html>
