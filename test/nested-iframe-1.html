<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nested Iframe Level 1: Billing & Intermediate Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e293b;
      color: #e2e8f0;
      padding: 16px;
      margin: 0;
    }
    .billing-box {
      border: 1px solid #475569;
      padding: 16px;
      border-radius: 8px;
      background: #0f172a;
    }
    h2 {
      margin-top: 0;
      font-size: 14px;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #0369a1;
      color: #bae6fd;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
    }
    iframe {
      width: 100%;
      height: 320px;
      border: 1px dashed #64748b;
      border-radius: 6px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="billing-box">
    <h2>
      <span>Billing & Verification Portal</span>
      <span class="badge">Level 1 (Intermediate Frame)</span>
    </h2>
    <div class="form-group">
      <label>Customer Email (PII Target)</label>
      <input type="email" id="billingEmail" value="jane.doe.secure@confidential.org" />
    </div>
    <div class="form-group">
      <label>Contact Phone (PII Target)</label>
      <input type="tel" id="billingPhone" value="+1-555-019-2834" />
    </div>

    <!-- Embedded Nested Iframe Level 2 -->
    <iframe id="paymentFrame" src="nested-iframe-2.html" title="Payment Gateway Frame"></iframe>
  </div>
</body>
</html>
